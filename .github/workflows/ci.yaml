name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Belt and braces with the [skip ci] writeback commit message below.
    # NB: paths filters are NOT evaluated for tag pushes (GitHub docs), so
    # releases always build even though the tagged commit only touches
    # deploy/prod/kustomization.yaml.
    paths-ignore:
      - deploy/staging/kustomization.yaml

permissions:
  contents: write # writeback commit to deploy/staging
  packages: write # push to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute image ref
        id: ref
        run: |
          # GHCR requires a lowercase path; usernames may be mixed-case.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          else
            echo "version=main-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.version }}
          # Single source of truth for the running version — baked into the
          # image (Dockerfile ARG VERSION → ENV APP_VERSION → /api/version).
          build-args: |
            VERSION=${{ steps.ref.outputs.version }}

      # Staging deploy = a git commit (auditable; rollback = revert). Tag
      # builds skip this — prod is pinned by scripts/release.sh instead.
      - name: Write back staging image tag
        if: github.ref_type == 'branch'
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          sed -i "s/newTag: .*/newTag: ${VERSION}/" deploy/staging/kustomization.yaml
          if git diff --quiet; then
            echo "staging already at ${VERSION}; nothing to write back"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/staging/kustomization.yaml
          git commit -m "[skip ci] deploy: staging → ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
