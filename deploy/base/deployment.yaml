apiVersion: apps/v1
kind: Deployment
metadata:
  name: __APP__
  annotations:
    # Backstage (027): links this workload to the catalog component.
    backstage.io/kubernetes-id: __APP__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: __APP__
  template:
    metadata:
      labels:
        app: __APP__
    spec:
      containers:
        - name: __APP__
          # The :dev tag never deploys — the staging/prod overlays always pin a
          # real tag via `images:` (CI writeback / scripts/release.sh).
          # APP_VERSION is baked into the image at build time (Dockerfile ARG),
          # so there is no version env var to keep in sync here.
          image: ghcr.io/__USER__/__APP__:dev
          # IfNotPresent: images may be side-loaded onto nodes (private GHCR
          # fallback path) — Always would force a registry pull and fail.
          imagePullPolicy: IfNotPresent
          # YOUR RUNTIME BUDGET — explicit so it's visible in-file. These
          # mirror the platform LimitRange defaults (what you'd get if this
          # block were absent). Raising them is ALLOWED, within the per-env
          # tenant quota: 500m CPU requests / 512Mi memory requests / 1Gi
          # memory limits / 10 pods. Memory-hungry work (password hashing,
          # image processing, data frames) usually needs a higher memory
          # limit — tune the LIBRARY to fit too, not just the limit (see
          # AGENTS.md "Your runtime budget"). No CPU limit on purpose:
          # throttling hurts more than it protects on this platform.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: app-db, key: host }
            - name: DB_PORT
              valueFrom:
                secretKeyRef: { name: app-db, key: port }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: app-db, key: dbname }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: app-db, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-db, key: password }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
